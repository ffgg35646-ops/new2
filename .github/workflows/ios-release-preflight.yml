name: iOS Release Preflight

on:
  push:
    branches:
      - release/ios-app-store-prep
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      server_url:
        description: "Public HTTPS URL of the deployed Aqar Al-Batin app"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ios-simulator-build:
    name: Build iOS app for simulator (no signing)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Normalize the existing lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload normalized lockfile for repository repair
        uses: actions/upload-artifact@v4
        with:
          name: normalized-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Persist normalized lockfile on the iOS release branch
        if: (github.event_name == 'push' && github.ref_name == 'release/ios-app-store-prep') || (github.event_name == 'pull_request' && github.head_ref == 'release/ios-app-store-prep' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          cp package-lock.json "$RUNNER_TEMP/package-lock.normalized.json"
          git restore --source=HEAD --staged --worktree package-lock.json
          git fetch origin "$HEAD_BRANCH"
          git switch --force-create "$HEAD_BRANCH" FETCH_HEAD
          cp "$RUNNER_TEMP/package-lock.normalized.json" package-lock.json
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: normalize package lock for clean installs"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Install locked dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify the hosted app is public and reachable
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.CAPACITOR_SERVER_URL || 'https://new2-m5cvaxqrb-sss22.vercel.app' }}
        run: |
          node --input-type=module <<'NODE'
          const rawUrl = String(process.env.CAPACITOR_SERVER_URL || '').trim();
          let url;
          try {
            url = new URL(rawUrl);
          } catch {
            console.error('iOS preflight stopped: the hosted app URL is missing or invalid.');
            process.exit(1);
          }
          if (url.protocol !== 'https:' || !url.hostname) {
            console.error('iOS preflight stopped: the hosted app must use a public HTTPS URL.');
            process.exit(1);
          }
          let response;
          try {
            response = await fetch(url, { redirect: 'follow', signal: AbortSignal.timeout(20000) });
          } catch (error) {
            console.error('iOS preflight stopped: the hosted app cannot be reached from the build runner.');
            console.error(String(error?.message || error));
            process.exit(1);
          }
          const finalUrl = new URL(response.url);
          const body = (await response.text()).slice(0, 100000);
          if (!response.ok) {
            console.error(`iOS preflight stopped: hosted app returned HTTP ${response.status}.`);
            process.exit(1);
          }
          if (finalUrl.hostname !== url.hostname) {
            console.error('iOS preflight stopped: the hosted app redirected to another host (possibly an access/login page).');
            console.error(`Final host: ${finalUrl.hostname}`);
            process.exit(1);
          }
          if (/authentication required|sign in to vercel|vercel deployment protection|deployment protection|continue with github|log in to continue/i.test(body)) {
            console.error('iOS preflight stopped: the hosted app is protected and cannot be opened by the installed app.');
            process.exit(1);
          }
          if (!String(response.headers.get('content-type') || '').includes('text/html')) {
            console.error('iOS preflight stopped: the hosted app URL did not return an HTML app page.');
            process.exit(1);
          }
          if (!body.includes('عقار البطين')) {
            console.error('iOS preflight stopped: the URL did not serve the Aqar Al-Batin application page.');
            process.exit(1);
          }
          console.log(`Hosted Aqar Al-Batin app is reachable: ${url.origin} (HTTP ${response.status}).`);
          NODE


      - name: Generate/sync Capacitor iOS project
        env:
          CAPACITOR_BUILD_TARGET: release
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.CAPACITOR_SERVER_URL || '' }}
        run: npm run ios:prepare

      - name: Validate native iOS build
        run: |
          xcodebuild -version
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/AqarAlBatinDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-failure-log
          path: |
            ${{ runner.temp }}/AqarAlBatinDerivedData/Logs/**
          if-no-files-found: ignore
