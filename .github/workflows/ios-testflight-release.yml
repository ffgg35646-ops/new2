name: iOS Signed Release and TestFlight

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS runtime URL for the app's server routes (existing production URL)"
        required: true
        type: string
      app_version:
        description: "Marketing version shown to users"
        required: true
        default: "1.0.0"
        type: string
      upload_to_testflight:
        description: "Upload the signed IPA to App Store Connect after export"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  signed-ios-release:
    name: Archive, sign, and optionally upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CAPACITOR_SERVER_URL: ${ inputs.server_url }}
      APPLE_TEAM_ID: B7864TA42J
      APP_BUNDLE_ID: cloud.baytialkhass.app
      APP_VERSION: ${ inputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode and report versions
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iOS|iOS Simulator'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate runtime URL and release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CAPACITOR_SERVER_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Provide an accessible HTTPS production URL. This workflow does not deploy the website or backend."
            exit 1
          fi
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::app_version must look like 1.0 or 1.0.0."
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --max-time 45 --output /dev/null "$CAPACITOR_SERVER_URL"

      - name: Check required signing and App Store Connect secrets
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_PROVISIONING_PROFILE_BASE64 \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY; do
            if [[ -z "\${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( \${#missing[@]} > 0 )); then
            printf '::error::Missing GitHub Actions secrets: %s\n' "\${missing[*]}"
            echo "::error::Configure them in repository Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npm run cap:ios:add

      - name: Prepare deployment target and App Store icon
        run: npm run cap:ios:prepare

      - name: Sync Capacitor assets
        run: npm run cap:ios:sync

      - name: Import Apple Distribution certificate and install provisioning profile
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/aqar-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-distribution.p12"
          security import "$RUNNER_TEMP/apple-distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          PROFILE_PATH="$RUNNER_TEMP/aqar-app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/aqar-app-store-profile.plist"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")

          if [[ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::Provisioning profile Team ID does not match $APPLE_TEAM_ID."
            exit 1
          fi
          if [[ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$APP_BUNDLE_ID" ]]; then
            echo "::error::Provisioning profile App ID does not match $APP_BUNDLE_ID."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Provisioning profile validated for $APP_BUNDLE_ID and Team ID $APPLE_TEAM_ID."

      - name: Verify app bundle identifier and icon asset
        run: |
          set -euo pipefail
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = cloud.baytialkhass.app;' ios/App/App.xcodeproj/project.pbxproj
          test -s ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          sips -g pixelWidth -g pixelHeight ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Archive signed iOS app
        env:
          PROFILE_NAME: ${ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AqarAlBatin.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/aqar-derived" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$APP_VERSION" \
            archive

      - name: Export signed App Store IPA
        env:
          PROFILE_NAME: ${ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/ExportOptions.plist" "$PROFILE_NAME" "$APPLE_TEAM_ID" "$APP_BUNDLE_ID" <<'PY'
          import plistlib, sys
          path, profile_name, team_id, bundle_id = sys.argv[1:]
          options = {
              "destination": "export",
              "method": "app-store-connect",
              "signingStyle": "manual",
              "teamID": team_id,
              "provisioningProfiles": {bundle_id: profile_name},
          }
          with open(path, "wb") as handle:
              plistlib.dump(options, handle)
          PY
          mkdir -p "$RUNNER_TEMP/ipa"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/AqarAlBatin.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH="$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" || ! -s "$IPA_PATH" ]]; then
            echo "::error::Xcode did not export an IPA."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Signed IPA exported successfully."

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqar-ios-release-ipa
          path: ${ runner.temp }}/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build to App Store Connect / TestFlight
        if: ${ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "\${IPA_PATH:-}" || ! -s "$IPA_PATH" ]]; then
            echo "::error::Signed IPA is missing."
            exit 1
          fi
          KEY_ID="$APP_STORE_CONNECT_API_KEY_ID"
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_\${KEY_ID}.p8"
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_\${KEY_ID}.p8" "$HOME/private_keys/AuthKey_\${KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_\${KEY_ID}.p8" "$HOME/private_keys/AuthKey_\${KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
