name: iOS Simulator Build Check

on:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare-ios.mjs"
      - "www/**"
      - ".github/workflows/ios-simulator-build.yml"
  pull_request:
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare-ios.mjs"
      - "www/**"
      - ".github/workflows/ios-simulator-build.yml"

jobs:
  ios-simulator:
    name: Build and launch on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npm run cap:ios:add

      - name: Set minimum iOS deployment target to 15
        run: npm run cap:ios:prepare

      - name: Sync Capacitor
        run: npm run cap:ios:sync

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch the app in an iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$DEVICE_ID" cloud.baytialkhass.app
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/aqar-iphone-simulator.png"

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqar-iphone-simulator-screenshot
          path: ${{ runner.temp }}/aqar-iphone-simulator.png
          if-no-files-found: ignore
          retention-days: 3
