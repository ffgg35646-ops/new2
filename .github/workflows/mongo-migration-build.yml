name: Mongo migration build

on:
  push:
    branches:
      - main
      - fix/pro-subscription-30-days-expiry-notices
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - name: Verify Supabase dependency is gone
        run: |
          ! grep -RIn --exclude-dir=.git --exclude='*.bak*' --exclude='*.before-*' --exclude='*.backup*' -E '@supabase/supabase-js|VITE_SUPABASE_|SUPABASE_URL' src package.json

      # The TanStack Vite plugin regenerates src/routeTree.gen.ts during the build.
      # Generate route types first, then run strict TypeScript validation.
      - run: npm run build

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
