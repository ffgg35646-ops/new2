<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رمز تأكيد البريد الإلكتروني</title>
</head>
<body style="margin:0;padding:0;background:#f8f5ed;font-family:Arial,sans-serif;color:#29251f;">
  <div style="max-width:520px;margin:40px auto;padding:24px;">
    <div style="background:#fefdfb;border:1px solid #e4dfd5;border-radius:20px;padding:32px;text-align:center;">
      <h1 style="margin:0 0 20px;font-size:24px;color:#245749;">عقار البطين</h1>
      <p style="margin:0 0 18px;font-size:16px;line-height:1.8;">مرحبًا بك في عقار البطين</p>
      <p style="margin:0 0 18px;font-size:15px;line-height:1.8;">استخدم رمز التأكيد التالي لإكمال إنشاء حسابك:</p>
      <div dir="ltr" style="margin:0 auto 22px;font-size:34px;font-weight:800;letter-spacing:10px;color:#245749;">
        {{ .Token }}
      </div>
      <p style="margin:0;font-size:13px;color:#777168;">لا تشارك هذا الرمز مع أي شخص.</p>
    </div>
  </div>
</body>
</html>
