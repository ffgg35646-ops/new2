<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#0f4d3a" />
    <title>عقار البطين</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4ee; color: #263a31; }
      main { box-sizing: border-box; width: min(92vw, 420px); padding: 28px; border-radius: 24px; background: white; text-align: center; box-shadow: 0 12px 40px #183b2715; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { font-size: 14px; line-height: 1.9; }
      code { display: inline-block; direction: ltr; unicode-bidi: isolate; border-radius: 8px; background: #edf2ed; padding: 4px 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>عقار البطين</h1>
      <p>ملفات التطبيق جاهزة، لكن رابط الموقع لم يُضبط بعد.</p>
      <p>لتشغيل التطبيق، عيّن متغير <code>CAPACITOR_SERVER_URL</code> إلى رابط الموقع عبر HTTPS عند تجهيز نسخة التوزيع، أو إلى عنوان خادم التطوير عند الاختبار المحلي، ثم أعد مزامنة Capacitor.</p>
    </main>
  </body>
</html>
